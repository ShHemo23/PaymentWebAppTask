name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # Cache NuGet packages to speed up subsequent runs
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Docker info
        run: docker info

      - name: Ensure Docker config for MCR
        run: |
          mkdir -p ~/.docker
          echo '{"auths":{"mcr.microsoft.com":{}}}' > ~/.docker/config.json

      # Restore & Build separate from Test to leverage the NuGet cache fully
      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # -----------------------
      # Checkout Code
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Initialize CodeQL
      # -----------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript

      # -----------------------
      # Autobuild for Analysis
      # -----------------------
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # -----------------------
      # Perform CodeQL Analysis
      # -----------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 