name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x']
        node-version: ['18.x']

    steps:
      # -----------------------
      # Checkout Code
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Setup .NET SDK
      # -----------------------
      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      # -----------------------
      # Restore & Build Backend
      # -----------------------
      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET solution
        run: dotnet build PaymentGateway.sln --configuration Release --no-restore

      # -----------------------
      # Run Backend Tests
      # -----------------------
      - name: Run unit tests
        run: dotnet test tests/PaymentGateway.Application.UnitTests --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test tests/PaymentGateway.Api.IntegrationTests --configuration Release --no-build

      - name: Run acceptance tests
        run: dotnet test tests/PaymentGateway.AcceptanceTests --configuration Release --no-build

      # -----------------------
      # Setup Node.js
      # -----------------------
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # -----------------------
      # Install Frontend Dependencies
      # -----------------------
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # -----------------------
      # Build Frontend
      # -----------------------
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # -----------------------
      # Publish Build Artifacts
      # -----------------------
      - name: Publish backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-drop
          path: src/PaymentGateway.Api/bin/Release/net8.0/

      - name: Publish frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-drop
          path: frontend/dist

      # -----------------------
      # Dependency Review
      # -----------------------
      - name: Dependency Review
        uses: actions/dependency-review-action@v3

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # -----------------------
      # Checkout Code
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Initialize CodeQL
      # -----------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: csharp,javascript

      # -----------------------
      # Autobuild for Analysis
      # -----------------------
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      # -----------------------
      # Perform CodeQL Analysis
      # -----------------------
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2 