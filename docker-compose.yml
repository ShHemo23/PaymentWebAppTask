version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentgateway_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=localdev!123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $SA_PASSWORD -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  api:
    build: .
    container_name: paymentgateway_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=PaymentGateway;User Id=sa;Password=localdev!123;TrustServerCertificate=true;
    ports:
      - "8080:80" 